[package]
name = "capture-view-gui"
version = "0.2.1"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "capture-view-gui"
path = "gui/src/main.rs"

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
ksni = { version = "=0.3.7", default-features = false, features = ["async-io", "blocking"] }

[profile.dev]
debug = 0

[profile.release]
opt-level = 2
strip = "debuginfo"

[patch.crates-io]
gpui = { path = "third-party/gpui" }
xattr = { path = "third-party/xattr" }
